[project]
name = "qabuddy"
version = "0.1.0"
description = "QABuddy.ai: local hybrid RAG assistant for QA engineers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qdrant-client>=1.15",
    "fastembed>=0.7",
    "ollama>=0.4",
    "httpx>=0.27",
    "mmh3>=5.3",
    "py-rust-stemmers>=0.1.8",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "docling>=2.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
]

[project.scripts]
qabuddy = "qabuddy.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qabuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Qdrant and Ollama running locally"]
